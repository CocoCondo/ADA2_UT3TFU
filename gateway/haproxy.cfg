global
    log stdout format raw daemon

defaults
    mode http
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend fe_http
    bind *:8080

    acl is_products path_beg /products
    acl is_recipes  path_beg /recipes
    acl is_shopping path_beg /shopping-lists

    use_backend be_products if is_products
    use_backend be_recipes  if is_recipes
    use_backend be_shopping if is_shopping

backend be_products
    server products1 products-service:8000 check

backend be_recipes
    server recipes1 recipes-service:8000 check

backend be_shopping
    server shopping1 shopping-service:8000 check
