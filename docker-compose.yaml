services:
  worker:
    build: .
    env_file: .env
    environment:
      INSTANCE: worker
      ENV: dev
      REDIS_URL: redis://redis:6379/0
      # (hereda también tus variables JWT si querés verificar algo en worker)
    depends_on:
      redis: { condition: service_healthy }
    command: python -m app.workers.recipes_worker

  redis:
      image: redis:7-alpine
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 2s
        retries: 20
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recipes
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipes"]
      interval: 10s
      timeout: 3s
      retries: 10

  api1:
    build: .
    env_file: .env
    environment:
      INSTANCE: api-1
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:     { condition: service_healthy }
      redis:  { condition: service_healthy }

  api2:
    build: .
    env_file: .env
    environment:
      INSTANCE: api-2
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:     { condition: service_healthy }
      redis:  { condition: service_healthy }

  lb:
    image: haproxy:2.9
    ports:
      - "8080:80"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on: 
      api1:
        condition: service_started
      api2:
        condition: service_started

  web:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - lb


volumes:
  dbdata:
